name: Factory — Spec

# Stage 1 (CLOUD PATH): label an issue 'factory' — an agent on GitHub's runners
# writes the spec, billed to a real ANTHROPIC_API_KEY.
on:
  issues:
    types: [labeled]

jobs:
  spec:
    # Skip if the issue is already approved — re-adding labels would otherwise
    # re-post the spec after implementation has started.
    if: github.event.label.name == 'factory' && !contains(github.event.issue.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Write implementation spec
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            You are the spec stage of a software factory. Read the issue with
            `gh issue view ${{ github.event.issue.number }}`, explore this repository to
            understand the existing code, and post an implementation spec as an issue
            comment using `gh issue comment`.

            The spec must contain:
            - Summary: one paragraph on what is being asked.
            - Files to change: exact paths that already exist in this repo.
            - Approach: the concrete change per file.
            - Tests: which test cases to add and where.
            - Risks / open questions.

            DO NOT write or modify any code. Post the spec comment and stop.
          claude_args: |
            --model claude-sonnet-4-5-20250929
            --allowedTools "Read,Glob,Grep,Write,Bash"
