name: Factory (local) — Review

# Stage 3: every PR gets reviewed by a DIFFERENT model than the one that wrote it.
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    if: startsWith(github.event.pull_request.head.ref, 'claude-local/')
    runs-on: [self-hosted, factory]
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Review the pull request
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: http://127.0.0.1:8317
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.CPA_PROXY_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the review stage of a software factory, and you did NOT write this
            code. Review it like an unimpressed senior engineer.

            Run `gh pr diff ${{ github.event.pull_request.number }}` to see the change,
            then read the surrounding files for context.

            Check specifically for:
            - Correctness bugs and unhandled edge cases.
            - Missing or inadequate tests.
            - Concurrency / shared-mutable-state problems.
            - Scope creep: changes not asked for by the linked issue.

            Post one review comment with `gh pr comment`. Start it with a verdict line:
            "VERDICT: APPROVE" or "VERDICT: REQUEST CHANGES". If you find nothing wrong,
            say so plainly — do not invent problems.
          claude_args: |
            --model claude-opus-4-5-20251101
            --allowedTools "Read,Glob,Grep,Write,Bash"
